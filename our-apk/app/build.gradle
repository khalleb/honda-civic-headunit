plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khalleb.civichmi.autook'
    compileSdk 33

    defaultConfig {
        applicationId 'com.khalleb.civichmi.autook'
        minSdk 17
        targetSdk 17
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
