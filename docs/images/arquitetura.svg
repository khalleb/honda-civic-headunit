<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Pipeline de deploy: PC → pacote OTA → pendrive → central → recovery → /system">
  <defs>
    <linearGradient id="box" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="boxHi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="#0a0a0a"/>

  <text x="600" y="40" text-anchor="middle" fill="#eee"
        font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600">Deploy via EvilValet OTA</text>
  <text x="600" y="64" text-anchor="middle" fill="#888"
        font-family="Helvetica, Arial, sans-serif" font-size="14">Pendrive → cold boot → recovery → /system</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#eee">
    <g transform="translate(40,140)">
      <rect x="0" y="0" width="160" height="120" fill="url(#box)" stroke="#374151" rx="8"/>
      <text x="80" y="36" text-anchor="middle" font-size="36">💻</text>
      <text x="80" y="70" text-anchor="middle" font-weight="600">PC Linux</text>
      <text x="80" y="92" text-anchor="middle" font-size="12" fill="#9ca3af">python3 build.py</text>
      <text x="80" y="108" text-anchor="middle" font-size="12" fill="#9ca3af">gradlew assembleRelease</text>
    </g>

    <line x1="200" y1="200" x2="245" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(250,140)">
      <rect x="0" y="0" width="160" height="120" fill="url(#box)" stroke="#374151" rx="8"/>
      <text x="80" y="36" text-anchor="middle" font-size="36">📦</text>
      <text x="80" y="70" text-anchor="middle" font-weight="600">SwUpdate.mdt</text>
      <text x="80" y="92" text-anchor="middle" font-size="12" fill="#9ca3af">Zip signed c/</text>
      <text x="80" y="108" text-anchor="middle" font-size="12" fill="#9ca3af">AOSP testkey</text>
    </g>

    <line x1="410" y1="200" x2="455" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(460,140)">
      <rect x="0" y="0" width="160" height="120" fill="url(#box)" stroke="#374151" rx="8"/>
      <text x="80" y="36" text-anchor="middle" font-size="36">💾</text>
      <text x="80" y="70" text-anchor="middle" font-weight="600">Pendrive FAT32</text>
      <text x="80" y="92" text-anchor="middle" font-size="12" fill="#9ca3af">/0040/SwUpdate.mdt</text>
      <text x="80" y="108" text-anchor="middle" font-size="12" fill="#9ca3af">+ SwUpdate2.txt</text>
    </g>

    <line x1="620" y1="200" x2="665" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(670,140)">
      <rect x="0" y="0" width="160" height="120" fill="url(#boxHi)" stroke="#60a5fa" rx="8"/>
      <text x="80" y="36" text-anchor="middle" font-size="36">🚗</text>
      <text x="80" y="70" text-anchor="middle" font-weight="600" fill="#fff">AUDIO 5s</text>
      <text x="80" y="92" text-anchor="middle" font-size="12" fill="#dbeafe">+ confirmar</text>
      <text x="80" y="108" text-anchor="middle" font-size="12" fill="#dbeafe">reiniciar</text>
    </g>

    <line x1="830" y1="200" x2="875" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(880,140)">
      <rect x="0" y="0" width="160" height="120" fill="url(#box)" stroke="#374151" rx="8"/>
      <text x="80" y="36" text-anchor="middle" font-size="36">⚙️</text>
      <text x="80" y="70" text-anchor="middle" font-weight="600">daupdater</text>
      <text x="80" y="92" text-anchor="middle" font-size="12" fill="#9ca3af">valida testkey +</text>
      <text x="80" y="108" text-anchor="middle" font-size="12" fill="#9ca3af">rom_type=0040</text>
    </g>

    <line x1="1040" y1="200" x2="1085" y2="200" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(1090,140)">
      <rect x="0" y="0" width="100" height="120" fill="url(#box)" stroke="#374151" rx="8"/>
      <text x="50" y="36" text-anchor="middle" font-size="36">📂</text>
      <text x="50" y="70" text-anchor="middle" font-weight="600">/system</text>
      <text x="50" y="92" text-anchor="middle" font-size="11" fill="#9ca3af">AutoOk.apk</text>
      <text x="50" y="108" text-anchor="middle" font-size="11" fill="#9ca3af">+ su setuid</text>
    </g>
  </g>

  <g transform="translate(40,320)" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#888">
    <text x="0" y="0">A cada BOOT_COMPLETED do carro:</text>
    <text x="0" y="20" fill="#aaa"><tspan fill="#60a5fa" font-weight="600">AutoOkService</tspan> → logcat watcher → detecta aviso → <tspan fill="#4ade80" font-weight="600">su -c "input tap 400 350"</tspan> → aviso some em ~5s</text>
  </g>
</svg>
