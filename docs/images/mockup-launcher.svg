      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bezel2)"/>
  <rect x="8" y="8" width="784" height="464" fill="#000" rx="4"/>

  <rect x="48" y="36" width="704" height="30" fill="url(#statusBg)" rx="2"/>
