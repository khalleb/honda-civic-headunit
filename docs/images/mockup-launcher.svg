  <text x="740" y="56" fill="#f8f8f8" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="end">22°C</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#eee" text-anchor="middle">
    <g transform="translate(130,120)">
