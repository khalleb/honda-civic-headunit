<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="Tela principal (launcher) da central depois do aviso ser dispensado">
  <defs>
    <linearGradient id="bezel2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="0%" y2="100%">
