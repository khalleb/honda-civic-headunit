<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f27121"/>
    </linearGradient>
  </defs>

  <!-- fundo circular -->
  <circle cx="200" cy="200" r="190" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#accent)" stroke-width="4"/>

  <!-- volante estilizado -->
  <g transform="translate(200,160)" fill="none" stroke="#e8e8f0" stroke-width="6" stroke-linecap="round">
    <circle cx="0" cy="0" r="55"/>
    <circle cx="0" cy="0" r="12" fill="#e8e8f0"/>
    <line x1="-55" y1="0" x2="-15" y2="0"/>
    <line x1="15" y1="0" x2="55" y2="0"/>
    <line x1="0" y1="15" x2="0" y2="55"/>
  </g>

  <!-- "G10" texto -->
  <text x="200" y="275" text-anchor="middle" fill="#e8e8f0"
        font-family="monospace" font-size="42" font-weight="bold" letter-spacing="4">G10</text>

  <!-- "skip disclaimer" texto -->
  <text x="200" y="310" text-anchor="middle" fill="url(#accent)"
        font-family="monospace" font-size="18" font-weight="bold" letter-spacing="3">SKIP · DISCLAIMER</text>

  <!-- símbolo "check" -->
  <g transform="translate(140,340)" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="0,8 8,16 24,0"/>
  </g>

  <text x="200" y="358" text-anchor="middle" fill="#e8e8f0"
        font-family="monospace" font-size="12" letter-spacing="2">OPEN · AUTO · FREE</text>
</svg>
