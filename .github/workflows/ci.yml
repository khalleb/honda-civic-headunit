name: CI

on:
  push:
    branches: [main]
    paths:
      - 'tooling/ota-build/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'tooling/ota-build/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  lint-python:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: py_compile build scripts
        run: python -m py_compile tooling/ota-build/*.py

  smoke-build:
    name: Smoke build (OTA package)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone ic1101 ota-builder reference
        run: |
          mkdir -p tooling/references
          git clone --depth 1 https://github.com/librick/ic1101.git tooling/references/ic1101

      - name: Create binary stubs (busybox, su) and APK stub
        run: |
          mkdir -p tooling/ota-build/bin tooling/ota-build/overlay/system/app
          printf 'STUB_BUSYBOX' > tooling/ota-build/bin/busybox
          printf 'STUB_SU' > tooling/ota-build/bin/su
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('tooling/ota-build/overlay/system/app/AutoOk.apk', 'w') as z:
              z.writestr('AndroidManifest.xml', b'stub')
          PY

      - name: Build install OTA package
        run: python3 tooling/ota-build/build.py

      - name: Build rollback OTA package
        run: python3 tooling/ota-build/build-rollback.py

      - name: Validate install output
        run: |
          test -n "$(find tooling/ota-build/output -name SwUpdate.mdt)" || { echo "install SwUpdate.mdt missing"; exit 1; }
          test -n "$(find tooling/ota-build/output -name SwUpdate2.txt)" || { echo "install SwUpdate2.txt missing"; exit 1; }
          find tooling/ota-build/output -type f -printf '%p %s\n'

      - name: Validate rollback output
        run: |
          test -n "$(find tooling/ota-build/output-rollback -name SwUpdate.mdt)" || { echo "rollback SwUpdate.mdt missing"; exit 1; }
          find tooling/ota-build/output-rollback -type f -printf '%p %s\n'
